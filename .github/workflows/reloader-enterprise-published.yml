name: Dispatch event for published release

on:
  release:
    types: [published]

# Authenticates with a PAT, not GITHUB_TOKEN — no token scopes needed.
permissions: {}

jobs:
  dispatch:
    # Skip chart releases. release-helm-chart.yaml publishes those as GitHub
    # releases too, and a chart tag carries no operator source to build, so a
    # dispatch would produce a Go image named after a chart version.
    # Prereleases are deliberately allowed through so betas get an enterprise
    # image alongside the OSS one.
    if: ${{ !startsWith(github.event.release.tag_name, 'chart-v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger target repository workflow
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          payload=$(jq -nc --arg tag "$RELEASE_TAG" \
            '{event_type: "release-published", client_payload: {tag: $tag}}')
          curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.STAKATER_AB_TOKEN_FOR_RLDR }}" \
          https://api.github.com/repos/stakater-ab/reloader-enterprise/dispatches \
          -d "$payload"
